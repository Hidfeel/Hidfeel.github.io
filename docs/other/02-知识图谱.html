<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>精神分析知识图谱 · 课程依赖拓扑</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0d1117; --bg2:#161b22; --line:#2a3441; --txt:#e6edf3; --dim:#8b949e;
    --freud:#5b8ff9; --dev:#5ad8a6; --school:#9270ca; --tech:#f6903d;
    --clin:#e8684a; --soc:#5ad0e8; --res:#6dc8ec; --meta:#f2c94c; --pillar:#ff99c8;
  }
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{padding:10px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
  h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:.3px}
  .sub{font-size:11px;color:var(--dim);line-height:1.5}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .btn{font-size:11px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);
    background:#1c232c;color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#3d4a5c;color:var(--txt)}
  .btn.on{background:#243044;border-color:#4c7cf0;color:#cfe0ff}
  #search{font-size:11px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);
    background:#1c232c;color:var(--txt);width:120px;outline:none}
  #search:focus{border-color:#4c7cf0}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .chip{font-size:10px;padding:3px 8px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;opacity:.4;transition:.15s;user-select:none}
  .chip.on{opacity:1}
  .chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}

  main{flex:1 1 auto;display:flex;min-height:0;position:relative}
  #canvasWrap{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.dragging{cursor:grabbing}
  .lyr-label{fill:#4a5568;font-size:9px;font-weight:600;letter-spacing:1px}
  .lyr-line{stroke:#1a222c;stroke-width:1}
  .edge{fill:none;stroke:#2f3b4a;stroke-width:1.1;transition:.2s}
  .edge.inst{stroke-dasharray:3 3;stroke:#4a3a52}
  .edge.up{stroke:#4c7cf0;stroke-width:2;opacity:1}
  .edge.down{stroke:#f6903d;stroke-width:1.8;opacity:.95}
  .edge.mute{opacity:.07}
  .node{cursor:pointer}
  .node rect{stroke-width:1.2;transition:.2s}
  .node text{font-size:9.5px;fill:#dbe4ee;pointer-events:none;dominant-baseline:middle}
  .node.mute{opacity:.13}
  .node.sel rect{stroke:#fff;stroke-width:2.2}
  .node.up rect{stroke:#7aa5ff;stroke-width:1.8}
  .node.down rect{stroke:#ffb373;stroke-width:1.8}

  aside{flex:0 0 320px;border-left:1px solid var(--line);background:var(--bg2);
    overflow-y:auto;padding:14px 16px 40px}
  aside h2{margin:0 0 3px;font-size:14px}
  .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;margin:0 4px 6px 0}
  .sec{margin-top:14px}
  .sec h3{margin:0 0 5px;font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:600}
  .sec p{margin:0;font-size:12px;line-height:1.65;color:#c9d5e2}
  .lst{list-style:none;padding:0;margin:0}
  .lst li{font-size:11.5px;line-height:1.5;padding:4px 0 4px 8px;border-left:2px solid var(--line);
    margin-bottom:3px;color:#b9c6d4;cursor:pointer}
  .lst li:hover{border-left-color:#4c7cf0;color:#fff}
  .lst li.no{cursor:default;border-left-color:#20272f;color:var(--dim)}
  .txtbox{font-size:11.5px;line-height:1.7;color:#a9b8c8;background:#12181f;
    padding:9px 11px;border-radius:7px;border:1px solid #1f2731}
  .empty{color:var(--dim);font-size:12px;line-height:1.8;margin-top:8px}
  .hint{font-size:10.5px;color:#6b7684;line-height:1.7;margin-top:16px;
    border-top:1px solid var(--line);padding-top:12px}
  #close{display:none}

  @media (max-width:820px){
    main{flex-direction:column}
    aside{flex:0 0 auto;position:absolute;left:0;right:0;bottom:0;max-height:56%;
      border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;
      box-shadow:0 -8px 24px rgba(0,0,0,.5);transform:translateY(101%);transition:transform .25s;z-index:20}
    aside.show{transform:translateY(0)}
    #close{display:block;position:absolute;top:10px;right:12px;font-size:18px;color:var(--dim);
      cursor:pointer;line-height:1}
    #search{width:88px}
    h1{font-size:14px}
  }

  .bibcard{background:#12181f;border:1px solid #1f2731;border-radius:8px;padding:9px 11px;margin-bottom:9px}
  .bibtop{margin-bottom:6px}
  .bibk{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:7px;
    background:#15212e;color:#7aa5ff;border:1px solid #26405e;letter-spacing:.5px}
  .bibr{font-size:12px;line-height:1.6;color:#e2ebf4;font-style:italic;
    margin-bottom:7px;word-break:break-word}
  .bibrow{display:flex;gap:8px;font-size:11px;line-height:1.6;margin-bottom:4px}
  .bibrow .lbl{flex:0 0 56px;color:#6b7684;letter-spacing:.5px;flex-shrink:0}
  .bibrow .val{color:#aebccb;word-break:break-word;flex:1}
  .bibrow.biborg{background:#14110a;border-radius:6px;padding:5px 8px;margin:6px 0;
    border:1px solid #3a2f12}
  .bibrow.biborg .lbl{color:#f2c94c}
  .bibrow.biborg .val{color:#f0dca0}
  .bibn{font-size:10.5px;line-height:1.6;color:#7e8a99;margin-top:5px;
    border-top:1px dashed #232c36;padding-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>精神分析知识图谱 · 课程依赖拓扑</h1>
    <div class="sub"><span id="stat"></span> · 综合 NCP、WAWI、NIP、Columbia、SPSI、PINC、BPAS、Tavistock、SBPSP、CAPA 等机构公开课程表归纳</div>
    <div class="toolbar">
      <button class="btn on" data-view="layer">分层路径</button>
      <button class="btn" data-view="cluster">域聚类</button>
      <button class="btn" data-view="critical">关键主干</button>
      <button class="btn" id="reset">重置视图</button>
      <input id="search" placeholder="搜索节点…">
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main>
    <div id="canvasWrap">
      <svg id="svg"><g id="scene">
        <g id="gLayers"></g><g id="gEdges"></g><g id="gNodes"></g>
      </g></svg>
    </div>
    <aside id="panel">
      <span id="close">×</span>
      <div id="pc">
        <h2>如何使用</h2>
        <div class="empty">
          <b>点击任意节点</b>：蓝色高亮 = 它的全部前置知识链（不学会误读），橙色高亮 = 它支撑的后续内容。<br><br>
          <b>分层路径</b>：纵轴 = 认知阶段，从弗洛伊德文本逐层推进到分析师风格的形成。<br>
          <b>域聚类</b>：按九大知识域径向排布，看各域体量与交叉。<br>
          <b>关键主干</b>：全球课程共识中不可跳过的最小路径（约 11 个阶段）。<br><br>
          双指/滚轮缩放，拖拽平移。
        </div>
      </div>
    </aside>
  </main>
</div>
<script>
const DOM={
  freud:{n:"弗洛伊德与元心理学",c:"var(--freud)"},
  dev:{n:"发展与观察",c:"var(--dev)"},
  school:{n:"学派理论",c:"var(--school)"},
  tech:{n:"技术序列",c:"var(--tech)"},
  clin:{n:"精神病理与临床",c:"var(--clin)"},
  soc:{n:"伦理·社会·文化",c:"var(--soc)"},
  res:{n:"研究与跨学科",c:"var(--res)"},
  meta:{n:"书写与元技能",c:"var(--meta)"},
  pillar:{n:"训练支柱（制度）",c:"var(--pillar)"}
};
const LYR=["训练支柱","方法的诞生","基本文本","技术地基","结构与防御","位置与客体","反移情转向","整合与前沿","个人风格"];

// id, 标签, 域, 层, 要点, 核心文本, 开设该内容的机构举例
const N=[
["P1","个人训练分析","pillar",0,"四支柱之首。全球无一例外：没有个人分析的精神分析学习是关于游泳的文献综述。BPAS 要求分析满一年、经分析师认可才能开始上课。","频次：英国 5 次/周、北美与挪威 4 次/周、法德 3 次/周","BPAS 5次/周；BPSI 累计300h；PINC 累计450h；SBPSP ≥5年"],
["P2","理论与技术课程","pillar",0,"占训练约 1/3。APsA 规定 450 学时下限但不规定内容；法国 APF 明言教学'既非正规、亦非教条、亦非分阶'。","各机构 syllabus","SPSI 558学时；WAWI 360节；SBPSP 176研讨+选修100"],
["P3","督导下的控制个案","pillar",0,"在他人心智的监督下实践。乌拉圭模式规定：必须先完成 4 门弗洛伊德基础课才获准开始。","过程记录 + 督导","APsA ≥3例/200-225h；BPAS 2例；CFAR 2例各18月；SBPSP 每例80h"],
["P4","临床研讨与观察","pillar",0,"连续个案研讨 + 婴儿观察 + Work Discussion。集体思考的场所，也是承受不确定的训练场。","过程记录、présentation de malades","NCP Case Conference I–VIII；CAPA 每周CCS；拉康派患者展示"],
["P5","书写（第五支柱）","pillar",0,"近三十年被普遍制度化：不写，就不算学过。把体验概念化是训练的终点动作。","毕业论文、个案报告、Credo","NCP Getting It On Paper I&II；WAWI 221 Credo；CFAR 4篇论文；SFCP 写作工作坊"],

["F0","癔症研究与方法诞生","freud",1,"看方法如何从催眠、宣泄走向自由联想。读这里是为了理解精神分析是一次方法论革命，而非一套结论。","《癔症研究》(1895)选段、《科学心理学大纲》、《屏蔽记忆》(1899)","NCP Struggling with the Unconscious—Early Freud；WAWI 110a"],
["F1","释梦与初级过程","freud",2,"全部元心理学的地基。第七章的地形学模型是后续一切（含拉康）的共同起点。","《释梦》(1900) 尤其第七章","所有机构第一年必修；CAPA Year3 全体推荐 SE 摘要"],
["F2","性学三论与力比多发展","freud",2,"性心理发展阶段、多形性倒错、力比多经济学。也是性别与性倒错讨论的历史起点。","《性学三论》(1905)、《诙谐及其与无意识的关系》(1905)","NCP Later Freud I；WAWI 110b"],
["F3","朵拉与移情的发现","freud",2,"精神分析史上最著名的技术失败。所有技术课程的真正起点：移情是被'漏掉'之后才被看见的。","《一例癔症分析片段》(1905)","SPSI Y1 弗洛伊德及同代案例；NCP Freud 系列"],
["F4","技术论文组 1911–1915","freud",3,"精神分析技术的正典。开始治疗、移情动力学、重复与修通、移情之爱——四篇撑起整个技术传统。","《论治疗的开始》《移情的动力学》《回忆、重复与修通》《移情之爱的观察》","Columbia Theory of Technique I；NCP Clinical Practice II"],
["F5","论自恋 1914","freud",3,"自恋、自我理想、客体选择。自体心理学与自恋人格研究的共同源头，也是'自恋不可分析'旧论的出处。","《论自恋：一篇导论》(1914)","Columbia Theory II；NCP Evolution of Theory"],
["F6","压抑·无意识·本能","freud",3,"元心理学三篇。压抑的动力学是防御分析的直接前身。","《本能及其变化》《压抑》《无意识》(1915)","各机构第一至二年元心理学模块"],
["F7","哀悼与忧郁 1917","freud",3,"内摄、认同、自我的分裂。整个客体关系传统由此长出——克莱因抑郁位、Fairbairn、结案理论都以它为轴。","《哀悼与忧郁》(1917)","Columbia Theory II；PINC Freud cluster"],
["F8","超越快乐原则·死本能","freud",4,"重复强迫与死本能。克莱因派全盘接受、美国主流长期拒绝——这个分歧塑造了两个大陆的课程表。","《超越快乐原则》(1920)、《群体心理学与自我的分析》(1921)","NCP Later Freud II；WAWI 117 Freud III"],
["F9","自我与本我 1923","freud",4,"结构理论。自我心理学、防御分析、诊断学的地基。","《自我与本我》(1923)","SPSI Y1 结构理论；NCP Ego Psychology 前置"],
["F10","抑制、症状与焦虑 1926","freud",4,"信号焦虑理论——焦虑不再是压抑的产物而是其动因。这个反转是全部当代防御概念的枢轴。","《抑制、症状与焦虑》(1926)","Columbia；SPSI 现代结构理论"],
["F11","文明及其不满","freud",5,"精神分析的社会维度。当代种族、阶级、文化课程的历史前身。","《文明及其不满》(1930)、《一个幻觉的未来》","WAWI 335 Psychoanalysis in Context"],
["F12","可终止与不可终止的分析","freud",5,"晚期立场：分析的限度、性格阻抗、心理经济学的顽固。结案课程的必读。","《可终止与不可终止的分析》(1937)、《分析中的建构》(1937)、《精神分析纲要》(1938)","WAWI 417 Aspects of Termination；NCP Treatment Endings"],

["D1","婴儿观察（Bick 法）","dev",2,"英国体系的心脏。1948 年 Esther Bick 创于 Tavistock：每周 1 小时到家观察至 2 岁生日，观察时不记笔记，事后书写，每周小组报告。训练的不是育儿知识，而是在不理解时保持在场。","Bick 1964；《婴儿观察的教学价值》","Tavistock、BPAS、Anna Freud、bpf、NCP Year1、CAPA 独立项目"],
["D2","早期发展 0–18 月","dev",3,"从共生到分离个体化：Mahler、Spitz、Stern。婴儿研究与临床理论的接口。","Mahler《人类婴儿的心理诞生》、Stern《婴儿的人际世界》","SPSI Y2 婴儿观察 0–18月；NCP Reflecting on the Baby's Experience"],
["D3","幼儿期与俄狄浦斯","dev",3,"18 月至 7 岁：三角关系的建立、性别认同、超我雏形。","《小汉斯》、A. Freud《正常与病态》","SPSI Y3 18月–7岁；NCP Studying the Growing Child"],
["D4","潜伏期","dev",4,"升华、学习能力、同伴世界。临床上最被忽视的阶段。","Latency 相关文献","SPSI Y3 潜伏期"],
["D5","青少年发展","dev",4,"身份认同危机、第二次个体化、身体的再度陌生化。进食障碍与自伤的主要发生期。","Blos、Laufer、Erikson","NCP Adolescence（Y2）；NIP Narrative of Adolescence；CAPA Y4 Unit3"],
["D6","成人发展与老年","dev",5,"中年危机、生成性、丧失与有限性。晚期课程内容。","Adult Development 文献","NCP Adult Development（Y3）"],
["D7","依恋理论","dev",4,"Bowlby、Ainsworth、Main：把内在客体关系变成可测量的表征系统。心智化理论的前置。","Bowlby 三部曲、成人依恋访谈（AAI）","NCP Styles of Attachment；Columbia Theory IV attachment"],
["D8","Work Discussion","dev",2,"把职场与机构中的'此时此地'素材带入小组，训练对制度性无意识的觉察。英国 pre-clinical 必修。","Tavistock work discussion 传统","Tavistock M7（与婴儿观察并列为临床前双核）"],
["D9","儿童精神分析","dev",4,"游戏作为自由联想的替代。Klein 与 A. Freud 的儿童技术之争是学派分裂的原点。","Klein《儿童精神分析》、A. Freud 儿童分析技术","NCP Introduction to Child Psychoanalysis；Tavistock M80；NYPSI 儿童整合课"],

["S1","安娜·弗洛伊德与防御","school",4,"《自我与防御机制》(1936)：分析工作的着力点从内容转向形式——不是分析被压抑的什么，而是分析压抑本身。","A. Freud《自我与防御机制》(1936)","SPSI Y1 Anna Freud/结构理论；NCP Evolution of Theory I"],
["S2","自我心理学","school",5,"Hartmann、Kris、Loewenstein、Rapaport：适应、自我的无冲突领域、精神装置的系统化。二十世纪北美主流。","Hartmann《自我心理学与适应问题》(1939)","NYPSI 现代自我心理学；NCP Evolution of Theory I；CAPA Y4 Classics Ego Psych"],
["S3","Loewald 治疗作用","school",6,"分析关系本身具有结构建构功能——把自我心理学推向关系转向的枢纽人物。","Loewald 'On the Therapeutic Action of Psychoanalysis' (1960)","Columbia Theory III: Loewald & Kernberg"],
["S4","克莱因：抑郁位","school",5,"整体客体、内疚、修复。把哀悼从事件变成心理位置。","Klein 1935、1940 两篇躁郁状态论文","NCP Evolution of Theory II；Columbia Theory II；PINC Klein cluster"],
["S5","克莱因：PS 位与投射性认同","school",5,"1946 年《略论某些分裂机制》。分裂、投射性认同——当代临床最常用也最常被误用的概念。理解比昂与场论的绝对前置。","Klein 'Notes on Some Schizoid Mechanisms' (1946)","所有机构；WAWI 310a；SBPSP 必修模块"],
["S6","嫉羡与感恩","school",6,"原初嫉羡与死本能的临床形态。负性治疗反应的克莱因式解释。","Klein《嫉羡与感恩》(1957)","NCP Neo-Kleinians；SBPSP"],
["S7","Fairbairn 客体关系","school",5,"力比多不是寻求快感而是寻求客体。内在结构的三分模型，成瘾与依赖病理的理论工具。","Fairbairn《人格的精神分析研究》(1952)","WAWI 310a；PINC Independent cluster"],
["S8","温尼科特","school",6,"过渡客体、足够好的母亲、真假自体、独处的能力、反移情中的恨。需要克莱因作对照系，否则读成温情育儿学。","'Transitional Objects'(1953)、'Hate in the Counter-transference'(1949)、'The Capacity to be Alone'(1958)","NCP Winnicott I（Y2）；SPSI Y3；PINC Winnicott cluster"],

/* 文字宽度估算 */
function wOf(s){let w=0;for(const c of s)w+=(c.charCodeAt(0)>255?9.8:5.4);return Math.max(46,w+16)}

/* ---------- 布局 ---------- */
const domOrder=["pillar","freud","dev","school","tech","clin","soc","res","meta"];
function layoutLayer(){
  const maxL=8, top=58, gap=(H-top-78)/maxL;
  // 按层分组
  const groups={}; nodes.forEach(n=>{(groups[n.lyr]=groups[n.lyr]||[]).push(n)});
  Object.keys(groups).forEach(k=>{
    groups[k].sort((a,b)=>domOrder.indexOf(a.dom)-domOrder.indexOf(b.dom));
    groups[k].forEach(n=>n.y=top+ (+k)*gap);
  });
  const marginL=60, marginR=60, usable=W-marginL-marginR;
  // 确定性贪心排布：每层从左到右紧凑排列，保证零重叠
  // 排序优先按域、再按宽度降序（宽的先放，减少行尾碎片）
  Object.keys(groups).forEach(k=>{
    const arr=groups[k];
    const gap=16;  // 节点间距 px
    const totalW=arr.reduce((s,n)=>s+n.w+gap, 0)-gap; // 总宽度需求
    if(totalW<=usable){
      // 单行：居中排布
      let x=marginL+(usable-totalW)/2;
      arr.forEach(n=>{n.x=x+n.w/2; x+=n.w+gap});
    } else {
      // 需要两行：按域分两组，各自单行居中
      const doms=domOrder.filter(d=>arr.some(n=>n.dom===d));
      const mid=Math.ceil(doms.length/2);
      const leftDoms=new Set(doms.slice(0,mid));
      const left=arr.filter(n=>leftDoms.has(n.dom));
      const right=arr.filter(n=>!leftDoms.has(n.dom));
      function packRow(row,x0){
        const tw=row.reduce((s,n)=>s+n.w+gap,0)-gap;
        let x=x0+(usable/2-tw)/2;
        row.forEach(n=>{n.x=x+n.w/2; x+=n.w+gap});
      }
      packRow(left, marginL);
      packRow(right, marginL+usable/2);
      // 两行 y 微偏
      const dy=gap>0?gap*0.28:5; // 用变量名避免与外层gap冲突
      const off=24; // 上下偏移量
      left.forEach(n=>n.y-=off);
      right.forEach(n=>n.y+=off);
    }
  });
  return {mode:"layer",gap,top};
}
function layoutCluster(){
  const cx=W/2, cy=H/2, doms=domOrder;
  const cnt={}; nodes.forEach(n=>cnt[n.dom]=(cnt[n.dom]||0)+1);
  const R=Math.min(W,H)/2-110;
  doms.forEach((d,di)=>{
    const arr=nodes.filter(n=>n.dom===d);
    const a0=(di/doms.length)*Math.PI*2-Math.PI/2, span=(Math.PI*2/doms.length)*0.86;
    arr.sort((a,b)=>a.lyr-b.lyr);
    arr.forEach((n,i)=>{
      const rows=Math.ceil(Math.sqrt(arr.length*1.6)), r=Math.floor(i/rows), c=i%rows;
      const rad=200+r*72+(arr.length<6?60:0);
      const ang=a0+span*((c+.5)/rows-.5);
      n.x=cx+Math.cos(ang)*Math.min(rad,R); n.y=cy+Math.sin(ang)*Math.min(rad,R)*0.78;
    });
  });
  return {mode:"cluster"};
}
function render(){
  const meta = view==="cluster" ? layoutCluster() : layoutLayer();
  // 层线
  gL.innerHTML="";
  if(meta.mode==="layer"){
    for(let l=0;l<=8;l++){
      const y=meta.top+l*meta.gap;
      gL.insertAdjacentHTML("beforeend",
        `<line class="lyr-line" x1="20" y1="${y+26}" x2="${W-20}" y2="${y+26}"/>
         <text class="lyr-label" x="24" y="${y-13}">L${l} · ${LYR[l]}</text>`);
    }
  }
  gE.innerHTML=edges.map((e,i)=>{
    const a=byId[e.s],b=byId[e.t];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2+(meta.mode==="layer"?0:0);
    const cx1=a.x+(mx-a.x)*.5, cy1=a.y+(b.y-a.y)*.35;
    return `<path class="edge ${e.k}" data-i="${i}" d="M${a.x},${a.y} Q${cx1},${cy1} ${b.x},${b.y}"/>`;
  }).join("");
  gN.innerHTML=nodes.map(n=>
    `<g class="node" data-id="${n.id}" transform="translate(${n.x},${n.y})">
      <rect x="${-n.w/2}" y="-10" width="${n.w}" height="20" rx="9"
        fill="${shade(n.dom)}" stroke="${DOM[n.dom].c}"/>
      <text text-anchor="middle" x="0" y="0.5">${esc(n.label)}</text>
    </g>`).join("");
  gN.querySelectorAll(".node").forEach(g=>{
    g.addEventListener("click",ev=>{ev.stopPropagation();pick(g.dataset.id)});
  });
  paint();
}
function shade(d){return {freud:"#1b2b48",dev:"#183a2e",school:"#2b2140",tech:"#3a2515",
  clin:"#3a1d18",soc:"#123540",res:"#16333f",meta:"#3a3115",pillar:"#3d1f2e"}[d]}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function anc(id,dir){
  const m=dir==="up"?IN:OUT, seen=new Set(), st=[...m[id]];
  while(st.length){const c=st.pop(); if(seen.has(c))continue; seen.add(c); m[c].forEach(x=>st.push(x))}
  return seen;
}
function paint(){
  const crit = view==="critical";
  const vis = new Set(nodes.filter(n=>{
    if(!active.has(n.dom))return false;
    if(crit && !CRITICAL.includes(n.id) && n.dom!=="pillar")return false;
    return true;
  }).map(n=>n.id));
  let up=new Set(), down=new Set();
  if(sel){up=anc(sel,"up");down=anc(sel,"down")}
  gN.querySelectorAll(".node").forEach(g=>{
    const id=g.dataset.id;
    g.classList.remove("mute","sel","up","down");
    if(!vis.has(id)){g.classList.add("mute");return}
    if(!sel)return;
    if(id===sel)g.classList.add("sel");
    else if(up.has(id))g.classList.add("up");
    else if(down.has(id))g.classList.add("down");
    else g.classList.add("mute");
  });
  gE.querySelectorAll(".edge").forEach(p=>{
    const e=edges[+p.dataset.i];
    p.classList.remove("mute","up","down");
    if(!vis.has(e.s)||!vis.has(e.t)){p.classList.add("mute");return}
    if(!sel)return;
    const inUp=(up.has(e.s)||e.s===sel)&&(up.has(e.t)||e.t===sel);
    const inDn=(down.has(e.s)||e.s===sel)&&(down.has(e.t)||e.t===sel);
    if(inUp)p.classList.add("up"); else if(inDn)p.classList.add("down"); else p.classList.add("mute");
  });
}

function bibHtml(id){
  const list=BIB[id];
  if(!list||!list.length) return '';
  return '<div class="sec"><h3>核心文献（标准引用）</h3>'+
    list.map(b=>{
      const rows=[];
      if(b.s) rows.push(['SE / 标准版',b.s,false]);
      if(b.z) rows.push(['中译',b.z,false]);
      if(b.o) rows.push(['来源机构',b.o,true]);
      if(b.u) rows.push(['课程收录',b.u,false]);
      const rowHtml=rows.map(r=>`<div class="bibrow${r[2]?' biborg':''}"><span class="lbl">${esc(r[0])}</span><span class="val">${esc(r[1])}</span></div>`).join('');
      const note=b.n?`<div class="bibn">${esc(b.n)}</div>`:'';
      return `<div class="bibcard"><div class="bibtop"><span class="bibk">${esc(b.k||'')}</span></div>`+
        `<div class="bibr">${esc(b.r||'')}</div>`+rowHtml+note+'</div>';
    }).join('')+'</div>';
}

function pick(id){
  sel=(sel===id)?null:id; paint();
  if(!sel){panel.classList.remove("show");return}
  const n=byId[id], pre=IN[id].map(x=>byId[x]), post=OUT[id].map(x=>byId[x]);
  const allUp=anc(id,"up").size;
  pc.innerHTML=`
    <h2>${esc(n.label)}</h2>
    <span class="tag" style="background:${shade(n.dom)};color:${DOM[n.dom].c}">${DOM[n.dom].n}</span>
    <span class="tag" style="background:#1c232c;color:#8b949e">L${n.lyr} · ${LYR[n.lyr]}</span>
    ${CRITICAL.includes(id)?'<span class="tag" style="background:#2d2413;color:#f2c94c">关键主干</span>':''}
    <div class="sec"><h3>为什么在这个位置</h3><p>${esc(n.why)}</p></div>
    ${bibHtml(id)}
    <div class="sec"><h3>开设该内容的机构（举例）</h3><div class="txtbox">${esc(n.inst)}</div></div>
    <div class="sec"><h3>直接前置（共 ${allUp} 个上游节点）</h3>
      <ul class="lst">${pre.length?pre.map(p=>`<li data-go="${p.id}">← ${esc(p.label)}</li>`).join(""):'<li class="no">无——这是一个起点</li>'}</ul></div>
    <div class="sec"><h3>它支撑什么</h3>
      <ul class="lst">${post.length?post.map(p=>`<li data-go="${p.id}">→ ${esc(p.label)}</li>`).join(""):'<li class="no">无——这是一个终点</li>'}</ul></div>
    <div class="hint">蓝色 = 全部前置链（跳过则误读）；橙色 = 它支撑的后续内容。点击上方列表可跳转。</div>`;
  pc.querySelectorAll("[data-go]").forEach(li=>li.addEventListener("click",()=>pick(li.dataset.go)));
  panel.classList.add("show");
}
document.getElementById("close").onclick=()=>{panel.classList.remove("show");sel=null;paint()};

const chips=document.getElementById("chips");
chips.innerHTML=Object.keys(DOM).map(k=>{
  const c=nodes.filter(n=>n.dom===k).length;
  return `<span class="chip on" data-d="${k}" style="background:${shade(k)};color:${DOM[k].c};border-color:${DOM[k].c}">
    <i style="background:${DOM[k].c}"></i>${DOM[k].n} ${c}</span>`}).join("");
chips.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
  const d=ch.dataset.d;
  if(active.has(d)){active.delete(d);ch.classList.remove("on")}else{active.add(d);ch.classList.add("on")}
  paint();
}));

document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); view=b.dataset.view;
  if(view==="critical"){render();fit()}else{render();fit()}
}));

document.getElementById("search").addEventListener("input",ev=>{
  const q=ev.target.value.trim();
  if(!q)return;
  const hit=nodes.find(n=>n.label.includes(q)||n.id.toLowerCase()===q.toLowerCase()
    ||n.why.includes(q)||n.txt.includes(q)||n.inst.includes(q));
  if(hit){pick(hit.id);centerOn(hit)}
});

/* 缩放平移 */
let tx=0,ty=0,k=1;
function apply(){scene.setAttribute("transform",`translate(${tx},${ty}) scale(${k})`)}
function fit(){
  const r=svg.getBoundingClientRect();
  k=Math.min(r.width/W,r.height/H)*0.97;
  tx=(r.width-W*k)/2; ty=(r.height-H*k)/2; apply();
}
function centerOn(n){
  const r=svg.getBoundingClientRect();
  k=Math.max(k,0.75); tx=r.width/2-n.x*k; ty=r.height/2-n.y*k; apply();
}
let drag=false,px=0,py=0;
svg.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;svg.classList.add("dragging")});
svg.addEventListener("pointermove",e=>{if(!drag)return;tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply()});
["pointerup","pointerleave","pointercancel"].forEach(t=>svg.addEventListener(t,()=>{drag=false;svg.classList.remove("dragging")}));
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=e.deltaY<0?1.12:1/1.12,nk=Math.max(0.22,Math.min(3.2,k*f));
  tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; apply();
},{passive:false});
let pts=new Map(),d0=0,k0=1;
svg.addEventListener("pointerdown",e=>pts.set(e.pointerId,e));
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return; pts.set(e.pointerId,e);
  if(pts.size===2){
    drag=false;
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(!d0){d0=d;k0=k;return}
    const r=svg.getBoundingClientRect();
    const mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top;
    const nk=Math.max(0.22,Math.min(3.2,k0*(d/d0)));
    tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; apply();
  }
});
["pointerup","pointercancel","pointerleave"].forEach(t=>svg.addEventListener(t,e=>{pts.delete(e.pointerId);if(pts.size<2)d0=0}));

document.getElementById("stat").textContent=
  `${nodes.length} 个知识节点 / ${edges.length} 条依赖边`;
render(); fit();
window.addEventListener("resize",fit);
</script>
</body>
</html>
